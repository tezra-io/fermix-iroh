# ring declares "Apache-2.0 AND ISC" and says which code is under which in
# LICENSE. Code from BoringSSL is Apache-2.0 (LICENSE-BoringSSL), or ISC with
# the notice at the top of each file: one such notice per copyright holder is
# shipped, besides ring's own (LICENSE-other-bits), fiat-crypto's, and the
# Apache-2.0 text of the code ring takes from once_cell. That code's MIT text
# is outside ring's expression, so cargo-about drops it; the once_cell crate's
