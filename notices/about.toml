# cargo-about's configuration for the crates part of THIRD-PARTY-NOTICES.txt.
# notices/generate.sh runs it; see README "Third-party notices".

# Every crate any release target compiles in, build-time crates included. Tests
# and examples never ship, so dev-dependencies are left out, and fermix-iroh's
# own licence heads the file instead of appearing here.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
ignore-dev-dependencies = true
private = { ignore = true }

# Exactly the licences the graph needs. Where a crate offers a choice, the
# first listed wins: MIT, because a crate's LICENSE-MIT carries its copyright
# line.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

# MPL-2.0 for this crate alone, unmodified, through iroh's port mapping
# (portmapper, igd-next). MPL-2.0 §3.2(a) asks that a binary's Source Code Form
# be made available and its recipients told how to get it. For this unmodified
# crate that is the crates.io archive at the version and sha256 the template
# names with the licence text.
[attohttpc]
accepted = ["MPL-2.0"]

# Every clarification below pins the exact text it ships by checksum; a crate
# update that changes one fails generate.sh until it is reviewed here.

# Code derived from Tailscale, under BSD-3-Clause, alongside iroh's own licence.
# iroh's crates ship no LICENSE-MIT, so it is read from the commit each was
# published from (.cargo_vcs_info.json).
[iroh.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

[[iroh.clarify.files]]
path = "LICENSE-BSD3"
license = "BSD-3-Clause"
